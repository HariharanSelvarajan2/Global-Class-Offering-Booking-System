server.port=${BOOKING_SERVICE_PORT:8082}

spring.application.name=booking-service

spring.datasource.url=${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${BOOKING_DB_USERNAME:postgres}
spring.datasource.password=${BOOKING_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

services.course-service.url=${COURSE_SERVICE_URL:http://localhost:8081}

springdoc.swagger-ui.path=/swagger-ui.html
