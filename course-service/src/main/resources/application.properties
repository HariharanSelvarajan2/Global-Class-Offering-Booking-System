server.port=${COURSE_SERVICE_PORT:8081}

spring.application.name=course-service

spring.datasource.url=${COURSE_DB_URL:jdbc:postgresql://localhost:5432/course_db}
spring.datasource.username=${COURSE_DB_USERNAME:postgres}
spring.datasource.password=${COURSE_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html